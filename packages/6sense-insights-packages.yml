description: >-
  6sense publishes NO first-party client libraries. This is a searched zero, not
  an unchecked one: npm, PyPI, RubyGems and the company's own GitHub
  organization (github.com/6si, 58 repos) were all enumerated and none contains
  a 6sense API SDK. The 6si org is almost entirely forks of infrastructure
  open source (Milvus, FAISS, Hive, Spark, TiKV, Hadoop) that 6sense runs
  internally — real engineering, but not a developer-facing distribution. The
  API reference ships copy-paste cURL, XHR, PHP, Python-requests and Postman
  snippets in place of an SDK. Two npm packages named for 6sense MCP exist and
  are recorded below explicitly as UNOFFICIAL so a later pass does not mistake
  them for first-party.
