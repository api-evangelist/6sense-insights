method: probed
status: published
source: >-
  https://support.6sense.com/docs/6sense-model-context-protocol-mcp-1 and
  https://support.6sense.com/docs/set-up-the-6sense-mcp-in-claude — plus a live
  probe of https://api.6sense.com/mcp, which returned HTTP 401 with
  WWW-Authenticate: Bearer resource_metadata="https://api.6sense.com/.well-known/oauth-protected-resource/mcp".
description: >-
  6sense operates an official REMOTE MCP server at https://api.6sense.com/mcp,
  currently in Beta. It is an RFC 9728 OAuth 2.0 protected resource: an
  unauthenticated tools/list POST returns 401 and the WWW-Authenticate challenge
  points at the protected-resource metadata, whose authorization server
  advertises the single scope `mcp:use` and supports dynamic client
  registration (RFC 7591), so MCP clients that implement DCR can connect without
  pre-provisioned credentials. The provider documents setup for Claude, ChatGPT
  and Microsoft Copilot Studio. The server is read-only in this release —
  6sense states it "does not execute actions or modify data" — and exposes the
  same data and capabilities as Revvy AI. Company and contact enrichment (the
  REST Enrichment APIs) are explicitly NOT available through MCP in this release.

deployment:
  mode: remote
  endpoint: https://api.6sense.com/mcp
  auth: oauth
  verified: probed
  note: >-
    No local stdio package is published by 6sense. Third-party npm packages
    named `6sense-mcp` and `adoptai-sixsense-mcp` exist on npm but are NOT
    first-party (published by adopt.ai and an unattributed author); they are
    recorded in packages/ as unofficial and are not treated as a 6sense
    deployment mode.

server:
  name: 6sense MCP
  transport: http
  url: https://api.6sense.com/mcp
  auth: oauth2
  release_stage: beta
  read_only: true
  protected_resource: well-known/6sense-insights-oauth-protected-resource-mcp.json
  authorization_server_metadata: well-known/6sense-insights-oauth-authorization-server.json
  authorization_server: https://auth.6sense.com/v1/apps/agentic/P32lusHUPY06hG8MJtqJnKEmq7hJ/MS3CTIZ4l7VZ4pFeraAIy18Y6wIVN
  scopes: [mcp:use]
  dynamic_client_registration: true
  resource_documentation: https://api.6sense.com/docs

