tools:
  status: not-enumerated
  note: >-
    The live tool list is auth-gated behind per-user OAuth — every 6sense user
    must authorize individually and access is scoped to their 6sense instance —
    so tools/list could not be enumerated anonymously and NO tool names are
    recorded here. 6sense does not publish a tool reference. The capability
    table below is the provider's own published description of what the server
    can do; it is NOT a tool list and must not be read as inputSchema evidence.
    Enumerating the real tools requires an authenticated introspection with a
    6sense Revenue Marketing account.

documented_capabilities:
  - capability: Account insights
    category: reporting
    description: >-
      Account activity, engagement and buying signals for a named account.
  - capability: 6QA trend analysis
    category: reporting
    description: >-
      6QA volume over time, accounts that became 6QA without follow-up,
      period-over-period comparison.
  - capability: Keyword performance
    category: reporting
    description: Top-performing keywords, intent trends and intent gaps.
  - capability: Ad campaign performance
    category: reporting
    description: >-
      Impressions, engagement and performance broken out by predictive buying
      stage.
  - capability: Website activity
    category: reporting
    description: Accounts that visited the site, pages viewed, engagement behavior.
  - capability: Account filtering and segment discovery
    category: reporting
    description: >-
      Segment membership and filter-based account discovery; results link back
      into the Segments UI.
  - capability: Market research
    category: research
    description: >-
      Competitor and positioning analysis, industry trends, personas, GTM and
      campaign recommendations, market/company news summaries.
  - capability: Product support
    category: support
    description: How-to, troubleshooting and product questions about 6sense itself.

not_included:
  - Company and contact enrichment are not available through MCP in this release.
  - No write/action tools — retrieval only.
  - Data outside Revvy-powered scenarios is not reachable.

access:
  requirement: >-
    A 6sense user account with access to the Revenue Marketing platform.
    Sales-Intelligence-only customers can test connectivity during the beta but
    with limited data availability.
  per_user_authorization: true
  multi_instance: >-
    Multiple connectors may be created, each authorized against a different
    6sense instance; connectors are isolated and data is not shared between them.

clients_documented:
