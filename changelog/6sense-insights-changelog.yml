description: >-
  6sense publishes a dated Product Release Notes series on its knowledge base,
  roughly every 4-8 weeks, plus a separate Monthly Company Data Refresh series
  that reports how the underlying account graph changed. The release notes are
  PRODUCT-scoped, not API-scoped: they announce platform features and only
  occasionally mention the APIs, and there is no per-version API changelog tied
  to the v1/v2/v3 path versions. There is no breaking-change section and no
  machine-readable feed.
