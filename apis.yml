aid: 6sense-insights
name: 6Sense Insights
description: >-
  6Sense Insights, Inc. (6sense) is a San Francisco-based revenue AI platform for B2B
  account-based marketing and sales. Using its Signalverse intent graph and 6AI predictive
  models, 6sense identifies in-market accounts, deanonymizes anonymous web traffic, scores
  leads and accounts, and enriches company and contact data across the buying journey.
  Backed by Battery Ventures, the company publishes a public API portal at api.6sense.com
  spanning Company Identification, Company Firmographics, Lead Scoring, and People
  Enrichment/Search APIs (token-authenticated). This record is the company / VC-portfolio
  profile for 6sense; the full, fully-enriched API contract set for the same company is
  maintained under the primary "6sense" provider in the API Evangelist network.
